<!DOCTYPE html>
<html>
<head>
    <title>Photo Gallery</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        /* Navigation Bar */
        .navbar {
            width: 85%;
            height: 75px;
            background-color: #182c4d;
            margin: 25px auto;
            padding: 15px 30px;
            box-sizing: border-box;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        .logo small {
            font-size: 13px;
        }

        .menu {
            display: flex;
            gap: 35px;
        }

        .menu a {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .menu a:hover {
            color: orange;
        }

        /* Heading */
        h1 {
            text-align: center;
            color: #333;
            margin-top: 35px;
            font-size: 32px;
        }

        h1 span {
            color: #d99a43;
        }

        .line {
            text-align: center;
            color: #d99a43;
            margin-bottom: 20px;
        }

        /* Gallery */
        .gallery {
            width: 850px;
            margin: auto;

            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .gallery img {
            width: 270px;
            height: 230px;
            object-fit: cover;
            border-radius: 12px;
            transition: 0.3s;
        }

     
      

    </style>
</head>

<body>

    <!-- Navbar -->
    <div class="navbar">

        <div class="logo">
            🏆 GLA<br>
            <small>UNIVERSITY</small>
        </div>

        <div class="menu">
            <a href="#">HOME</a>
            <a href="#">GALLERY</a>
            <a href="#">ABOUT</a>
        </div>

    </div>

    <!-- Heading -->
    <h1>PHOTO <span>GALLERY</span></h1>

    <div class="line">──── 📷 ────</div>

    <!-- Gallery Images -->
    <div class="gallery">

        <img src="https://preview.colorlib.com/theme/pentax/img/project/1.jpg.webp">

        <img src="https://preview.colorlib.com/theme/pentax/img/project/2.jpg.webp">

        <img src="https://preview.colorlib.com/theme/pentax/img/project/3.jpg.webp">

        <img src="https://preview.colorlib.com/theme/pentax/img/project/3.jpg.webp">

        <img src="https://preview.colorlib.com/theme/pentax/img/project/2.jpg.webp">

        <img src="https://preview.colorlib.com/theme/pentax/img/project/1.jpg.webp">

    </div>

</body>
</html>
