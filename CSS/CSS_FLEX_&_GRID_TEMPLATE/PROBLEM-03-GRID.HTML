<!DOCTYPE html>
<html lang="en">
<head>
   <style>
      .container{
       
        display: grid;
        grid-template-columns:2fr 1fr 1fr 1fr ;
        grid-template-rows: 150px 150px;
        gap: 15px;
        grid-template-areas:"a a b e"
                            "c d b e";
      }
      .box{
        background-color: black;
        color: aliceblue;
        font-size: 40px;
        padding: 30px;
        border-radius: 10px;
      }
      .a{
        grid-area: a;
      }
      .b{
        grid-area: b;
      }
      .c{
        grid-area: c;
      }
      .d{
        grid-area: d;
      }
      .e{
        grid-area: e;
      }
       
   </style>
</head>
<body>
    <div class="container">

     <div class="box a">A</div>
     <div class="box b">B</div>
     <div class="box c">C</div>
     <div class="box d">D</div>
     <div class="box e">E</div>
     
    </div>
</body>
</html>
